# keyd config for the pedal box: the salvaged keyboard controller, USB id 04d9:1702.
# Install as /etc/keyd/pedal.conf and `keyd reload`. The NixOS version lives in the
# dotfiles at nix/modules/system/pedal/default.nix and generates the same file.
# An explicit id beats the "*" default config, so this board gets only this file.
#
# Pedal 1..12 are wired to the F1..F12 matrix positions. Each comes out as a
# Ctrl+Alt+Shift+F<n> macro: one press and release the moment the pedal goes
# down, nothing more until it comes up. A plain remap would not do: the
# controller holds the key for as long as the foot is on the pedal and the
# compositor turns that into auto-repeat, so a REAPER action bound to it would
# fire over and over. macro_timeout pushed to ~25 days means a held macro never
# repeats. Ctrl+Alt+Shift collides with nothing a keyboard types, and Shift
# keeps Ctrl+Alt+F<n> from being read as a VT switch.
#
# F13..F24 were the first choice but do not survive the trip: the default xkb
# map turns FK13..FK23 into XF86Tools/Launch/Touchpad keysyms, and REAPER's
# SWELL only translates F1..F12 to begin with.

[ids]
04d9:1702

[global]
macro_timeout = 2147483647

[main]
f1 = macro(C-A-S-f1)
f2 = macro(C-A-S-f2)
f3 = macro(C-A-S-f3)
f4 = macro(C-A-S-f4)
f5 = macro(C-A-S-f5)
f6 = macro(C-A-S-f6)
f7 = macro(C-A-S-f7)
f8 = macro(C-A-S-f8)
f9 = macro(C-A-S-f9)
f10 = macro(C-A-S-f10)
f11 = macro(C-A-S-f11)
f12 = macro(C-A-S-f12)
